      <stop offset="0" stop-color="#05070c"/><stop offset="0.6" stop-color="#0b111b"/><stop offset="1" stop-color="#170d21"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#203540" stroke-width="1" opacity="0.55"/>
