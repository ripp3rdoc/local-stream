<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05070c">
  <title>Local Stream</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='1' fill='%2305070c' stroke='%2337edee'/%3E%3Cpolygon points='12 9 23 16 12 23' fill='white'/%3E%3C/svg%3E">
  <script>(function () {
    var d = document.documentElement;
    d.dataset.theme = 'samurai';
    d.dataset.mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/samurai.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" data-nav aria-label="Local Stream home">
      <span class="brand-mark" aria-hidden="true">侍</span>
      <span class="brand-text brand-name"><span>Local Stream</span><span class="brand-jp">ローカルストリーム</span></span>
    </a>
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="visually-hidden">Search videos</span>
      <input type="search" id="search" placeholder="Search all videos" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="topbar-actions">
      <button class="icon-btn" id="modeBtn"></button>
      <button class="icon-btn" id="sourcesBtn" title="Media folders" aria-label="Media folders" hidden></button>
      <button class="icon-btn" id="scanBtn" title="Rescan library" aria-label="Rescan library" hidden></button>
      <button class="icon-btn" id="accountBtn" title="Account" aria-label="Account"></button>
      <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out" hidden></button>
    </div>
  </header>

  <main class="page" id="view" tabindex="-1"></main>

  <!-- Media folders dialog -->
  <div class="modal" id="sourcesModal" role="dialog" aria-modal="true" aria-labelledby="sourcesTitle" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="sourcesTitle">Media folders</h2>
        <button class="icon-btn" id="sourcesClose" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <section>
          <div class="field-label">In your library</div>
          <div class="source-list" id="sourcesList"></div>
        </section>
        <section>
          <div class="field-label">Add a folder</div>
          <label class="field folder-path-field" for="folderPathInput">
            <span>Folder path</span>
            <input class="input" type="text" id="folderPathInput" placeholder="F:\Media\Movies" aria-describedby="folderPathHelp" autocomplete="off" autocapitalize="none" spellcheck="false">
          </label>
          <p class="muted-note" id="folderPathHelp">Paste a full folder path on the server, or browse below. Then choose Add folder.</p>
          <div class="browser">
            <div class="browser-path"><span id="browserPath">This PC</span></div>
            <div class="browser-list" id="browserList"></div>
          </div>
          <div class="add-row">
            <input class="input" type="text" id="categoryInput" placeholder="Collection name (optional)" aria-label="Collection name">
            <button class="btn btn-primary" id="addSourceBtn" disabled>Add folder</button>
          </div>
          <div class="form-error" id="addError" role="alert" hidden></div>
        </section>
      </div>
    </div>
  </div>

  <!-- Account dialog: your password; admins also manage accounts -->
  <div class="modal" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountTitle" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="accountTitle">Account</h2>
        <button class="icon-btn" id="accountClose" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <section id="meSection"></section>
        <section id="passwordSection" hidden>
          <div class="field-label">Change your password</div>
          <form class="account-form" id="passwordForm" autocomplete="on">
            <input type="text" name="username" id="pwUsername" autocomplete="username" hidden>
            <input class="input" type="password" id="pwCurrent" placeholder="Current password" aria-label="Current password" autocomplete="current-password" required>
            <input class="input" type="password" id="pwNew" placeholder="New password" aria-label="New password" autocomplete="new-password" minlength="4" required>
            <input class="input" type="password" id="pwConfirm" placeholder="Repeat new password" aria-label="Repeat new password" autocomplete="new-password" minlength="4" required>
            <button class="btn btn-primary" type="submit" id="pwSubmit">Update password</button>
          </form>
          <div class="form-error" id="pwError" hidden></div>
        </section>
        <section id="usersSection" hidden>
          <div class="field-label">Accounts</div>
          <div class="source-list" id="usersList"></div>
          <div class="field-label add-user-label" id="addUserLabel">Add an account</div>
          <form class="account-form add-user" id="addUserForm" autocomplete="off">
            <input class="input" type="text" id="newUsername" placeholder="Username" aria-label="New account username" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="32" required>
            <input class="input" type="password" id="newPassword" placeholder="Password" aria-label="New account password" autocomplete="new-password" minlength="4" required>
            <select class="select" id="newRole" aria-label="New account role">
              <option value="user">Viewer — can watch</option>
              <option value="admin">Admin — can also manage</option>
            </select>
            <button class="btn btn-primary" type="submit" id="addUserBtn">Add account</button>
          </form>
          <div class="form-error" id="addUserError" hidden></div>
        </section>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
