<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>Sign in · Local Stream</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='1' fill='%2305070c' stroke='%2337edee'/%3E%3Cpolygon points='12 9 23 16 12 23' fill='white'/%3E%3C/svg%3E">
  <script>(function () {
    var d = document.documentElement;
    d.dataset.theme = 'samurai';
    d.dataset.mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/samurai.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">侍</span>
      <h1>Local Stream</h1>
      <p>Sign in to watch your library</p>
    </div>

    <form id="loginForm" autocomplete="on" novalidate>
      <label class="field">
        <span>Username</span>
        <input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
      </label>
      <label class="field">
        <span>Password</span>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      </label>
      <div class="login-error" id="loginError" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        errorEl.textContent = 'Enter your username and password.';
        errorEl.hidden = false;
        return;
      }
      errorEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          // Lets the browser offer to save the password for this fetch-based form.
          if (window.PasswordCredential) {
            try {
              await navigator.credentials.store(new PasswordCredential({ id: username, password, name: username }));
            } catch (_) { /* declined or unsupported */ }
          }
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Sign in failed';
        errorEl.hidden = false;
        document.getElementById('password').select();
      } catch (err) {
        errorEl.textContent = 'Can’t reach the server. Check your connection and try again.';
        errorEl.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
  <script src="/js/common.js"></script>
  <script>LS.initDecor({ petals: true });</script>
</body>
</html>
